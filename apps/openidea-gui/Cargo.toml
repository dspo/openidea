# openidea-gui — the future GPUI frontend host (M1: workbench shell).
#
# Standalone package, deliberately OUTSIDE the root workspace: the gpui stack
# must never enter the main build graph (CI runs `cargo nextest run
# --workspace` and `cargo clippy --workspace` against it). The root
# Cargo.toml lists this directory in `exclude`; the empty `[workspace]` table
# below detaches this crate from any parent workspace.
#
# M1 scope: workbench shell (file tree / tab stack / status bar), real
# backend wiring — `ide-workspace` documents + `ide-vfs` IO and watching via
# path dependencies into `../../crates/*` — and the open/edit/save closed
# loop. The backend crates are UI-agnostic and stay in the main workspace;
# only this app crate leaves it.
[package]
name = "openidea-gui"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace]

[dependencies]
# GPUI stack: the longbridge gpui-kit line, exact-pinned to the versions
# manox-app (Steer) locks, so the two repos share one tested snapshot.
# gpui-pre is Longbridge's weekly repackaged snapshot of zed's gpui; this
# repo never depends on zed-industries/zed directly.
gpui = { package = "gpui-pre", version = "=0.3.9" }
# runtime_shaders compiles the Metal shaders at first launch instead of
# offline in the build script — the same feature set manox-app runs, and it
# avoids requiring the separately-downloadable Xcode Metal Toolchain here.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit", "runtime_shaders"] }
# Workbench chrome primitives (TabBar/Tab, StatusBar, Root, IconName).
gpui-component = { version = "=0.8.0" }
# The SVG icon set IconName resolves to, registered as the app AssetSource.
gpui-kit-assets = { version = "=0.8.0" }
# The openidea backend, in-process: the same crates the Tauri host drives.
ide-core = { path = "../../crates/ide-core" }
ide-text = { path = "../../crates/ide-text" }
ide-vfs = { path = "../../crates/ide-vfs" }
ide-workspace = { path = "../../crates/ide-workspace" }
# Editor syntax highlighting: the repo's bundled tree-sitter grammars via the
# public `Syntax::ts_language` seam ("for engines that parse on their own").
ide-language = { path = "../../crates/ide-language" }
# M3: language servers (rust-analyzer & co.) driven through the same
# LspManager the Tauri and headless hosts use.
ide-lsp = { path = "../../crates/ide-lsp" }
# M3: the project index — Go to File / Search Everywhere's fuzzy file and
# symbol engine (the same one the Tauri host queries).
ide-index = { path = "../../crates/ide-index" }
# M4: run configurations and process management (the same engine the Tauri
# host's Run tool window drives).
ide-run = { path = "../../crates/ide-run" }
# M4: the minimal git surface — status / diff / stage / commit through the
# same Repo the Tauri host's VCS feature drives.
ide-vcs = { path = "../../crates/ide-vcs" }
# M5: Find in Files (⇧⌘F) — the ripgrep-based project search the Tauri
# host's search drives; the workbench runs it on the background executor.
ide-search = { path = "../../crates/ide-search" }
# The charset constant for ide-vcs's TextEncoding (UTF-8 documents only here).
encoding_rs = "0.8"
# The app-side LSP server options overlay (M9's fork move: the gopls opt-ins
# `languages/go.toml` used to carry) builds a `toml::Value`; same major as
# the workspace pin (0.9).
toml = "0.9"
# The grammar Language values come from ide-language; this must resolve to the
# same tree-sitter the main workspace pins (0.25.10) so the types unify.
tree-sitter = "=0.25.10"
# The rope type ide-text exposes (`Document::rope`); semantic tokens map their
# UTF-16 positions onto byte ranges through it. Same version as ide-text pins.
ropey = { version = "1.6", default-features = false, features = ["simd"] }
# Query match iteration (`matches()` returns a streaming iterator).
streaming-iterator = "0.1"
# Windows-friendly path canonicalization, the repo-wide convention.
dunce = "1"
# The index cache directory follows the platform's cache location, exactly
# like ide-host (the main workspace pins `dirs = "6"`).
dirs = "6"
# bus.rs: the backend → UI event channel (the task pins tokio channels).
# The sync channels feed the watcher threads; M3 adds the app-owned runtime
# (rt-multi-thread + time) the LspManager captures and requests spawn onto.
tokio = { version = "1", default-features = false, features = ["sync", "rt-multi-thread", "time", "process"] }
# The backend crates log through `tracing` (launch failures, crashes); the
# app prints those to stderr, RUST_LOG filters.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
# ⌘O file dialog, invoked on a plain thread like Steer does (the sync rfd
# API must not run on gpui's main thread).
rfd = "0.15"
# M7 settings (recents, layout, font size): one JSON file, serde-shaped.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The headless gpui harness (TestAppContext / VisualTestContext): the M7
# focus/Esc-chain regression rides it, like gpui-component's own tests. Same
# pin as the runtime dependency — only the feature set widens, for tests.
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }

[profile.dev.package]
# gpui needs opt-level 3 even in debug, or rendering crawls. Keys use the
# real package names (gpui-pre*), not the dependency alias.
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }

[lints.clippy]
dbg_macro = "deny"
